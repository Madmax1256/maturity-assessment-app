name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pruebas del servidor
        working-directory: server
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Navegador para las pruebas de humo
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: App de tablet sin servidor configurado
        run: |
          npm run build:tablet
          npm run preview -w apps/tablet -- --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node apps/tablet/e2e/smoke.cjs
      - name: Tablet sincronizando con el servidor y portal web sobre esos datos
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE fs_e2e"
          (cd server && FS_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/fs_e2e FS_AUTH_MODE=dev \
            FS_BLOB_DIR=$RUNNER_TEMP/blobs FS_CORS_ORIGINS=http://localhost:4173,http://localhost:4174 \
            FS_BOOTSTRAP_ADMINS=admin FS_AUTO_ENROLL_ROLE=evaluador \
            python -m uvicorn app.main:create_app --factory --port 8000 &)
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 1; done
          VITE_SYNC_URL=http://localhost:8000 VITE_SYNC_TOKEN=dev:evaluador npm run build:tablet
          SYNC_URL=http://localhost:8000 node apps/tablet/e2e/smoke.cjs
          VITE_API_URL=http://localhost:8000 VITE_AUTH_MODE=dev npm run build:portal
          npm run preview -w apps/portal -- --port 4174 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4174/ >/dev/null && break; sleep 1; done
          node apps/portal/e2e/smoke.cjs
      - name: Modo local, con el portal publicado por el servidor y la tablet vinculada con código
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE fs_local"
          export FS_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/fs_local
          (cd server && python -c "import os; from app.admin_cli import create_admin; create_admin(os.environ['FS_DATABASE_URL'], 'max', 'Max', 'clave-admin-e2e')")
          npm run build:tablet
          npm run build:portal
          (cd server && FS_AUTH_MODE=local FS_BLOB_DIR=$RUNNER_TEMP/blobs-local FS_PORTAL_DIR=../apps/portal/dist \
            FS_CORS_ORIGINS=http://localhost:4173 python -m uvicorn app.main:create_app --factory --port 8100 &)
          for i in $(seq 1 30); do curl -sf http://localhost:8100/health >/dev/null && break; sleep 1; done
          node e2e/local-mode.cjs

  windows:
    # Instala el paquete para Windows en una máquina Windows real y lo prueba de punta a punta.
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Armar el zip del instalador
        run: |
          npm run build:portal
          npm run build:tablet
          python deploy/windows/empaquetar.py dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*.zip
      - name: Instalar como lo haría el usuario (sin tarea programada ni firewall)
        run: |
          Expand-Archive (Get-Item dist\*.zip).FullName -DestinationPath "$env:RUNNER_TEMP\pkg"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\pkg")[0].FullName
          $env:FS_ADMIN_PASSWORD = 'clave-admin-e2e'
          & "$dir\instalar.ps1" -NoInteractivo -Usuario max -Nombre 'Max Gajardo' -SinTareaProgramada -SinFirewall -SinAccesoDirecto -CarpetaRespaldo "$env:RUNNER_TEMP\respaldos"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Respaldo automático al iniciar
        run: |
          for ($i = 0; $i -lt 30 -and -not (Test-Path "$env:RUNNER_TEMP\respaldos\db\*.dump"); $i++) { Start-Sleep 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\respaldos\db\*.dump")) { Get-Content "$env:LOCALAPPDATA\FS-Diagnostico\logs\servidor.log"; exit 1 }
          Get-ChildItem "$env:RUNNER_TEMP\respaldos\db"
      - name: Reiniciar con la tablet de prueba permitida
        run: |
          $d = "$env:LOCALAPPDATA\FS-Diagnostico"
          Add-Content "$d\config.env" 'FS_CORS_ORIGINS=http://localhost:4173'
          & "$d\detener.ps1"
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$d\iniciar.ps1")
          for ($i = 0; $i -lt 60; $i++) { try { if ((Invoke-WebRequest http://127.0.0.1:8000/health -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { break } } catch { }; Start-Sleep 1 }
          (Invoke-WebRequest http://127.0.0.1:8000/v1/auth/config -UseBasicParsing).Content
      - name: Portal, vinculación y sincronización en Windows
        shell: bash
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
          npm run preview -w apps/tablet -- --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          SERVER_URL=http://127.0.0.1:8000 node e2e/local-mode.cjs
      - name: Respaldo manual y actualización conservando los datos
        run: |
          $d = "$env:LOCALAPPDATA\FS-Diagnostico"
          $env:FS_NO_PAUSE = '1'
          & "$d\respaldar.ps1"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\pkg")[0].FullName
          & "$dir\instalar.ps1" -NoInteractivo -SinTareaProgramada -SinFirewall -SinAccesoDirecto
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8000/v1/auth/login -ContentType 'application/json' -Body '{"username":"max","password":"clave-admin-e2e"}'
          $ev = Invoke-RestMethod -Uri http://127.0.0.1:8000/v1/evaluations -Headers @{ authorization = "Bearer $($r.token)" }
          if (-not ($ev | Where-Object { $_.company -eq 'Minera Local' })) { Write-Host 'Se perdió la evaluación al actualizar'; exit 1 }
          Write-Host "Evaluaciones después de actualizar: $($ev.Count)"
      - name: Registros del servidor
        if: always()
        run: Get-Content "$env:LOCALAPPDATA\FS-Diagnostico\logs\servidor.log" -Tail 80 -ErrorAction SilentlyContinue
